name: Build and host tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python homeassistant/test_ha_controls.py
      - run: node --experimental-vm-modules tests/converter_test.mjs
      - run: python tests/run_host.py --compiler g++
  firmware:
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: pio run -e phev_remote_c6
      - name: Package application image and corresponding source
        run: |
          mkdir -p dist
          cp .pio/build/phev_remote_c6/firmware.bin dist/firmware.bin
          cp LICENSE NOTICE.md dist/
          cp LICENSES/LGPL-2.1.txt dist/
          git archive --format=tar.gz HEAD > dist/source.tar.gz
          pio pkg list -e phev_remote_c6 > dist/build-dependencies.txt
          cd dist
          sha256sum firmware.bin source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: phev-remote-esp32c6-${{ github.sha }}
          path: dist/
          retention-days: 30
